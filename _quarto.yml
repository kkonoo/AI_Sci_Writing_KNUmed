format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 280px # toc

    include-after-body:
      - assets/language-switch.html

execute:
  freeze: auto
  echo: true
  eval: false
  warning: false
  message: false
