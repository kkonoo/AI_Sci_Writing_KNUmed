<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="120.00" y="57.95" font-size="3.881" fill="#262B33" font-weight="700">AI chat service</tspan><tspan x="120.00" y="63.93" font-size="3.704" fill="#262B33">also runs on company</tspan><tspan x="120.00" y="68.75" font-size="3.704" fill="#262B33">servers (the cloud)</tspan></text>
</g>
<g id="Files-in-a-synced-folder-are-uploaded-to">
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="4.00" y="79.70" font-size="3.528" fill="#6B7280">Files in a synced folder are uploaded to the cloud too. What you type into AI also leaves your computer.</tspan></text>
</g>
