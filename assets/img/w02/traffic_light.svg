<text text-anchor="start" letter-spacing="-0.015em"><tspan x="46.00" y="15.04" font-size="4.410" fill="#262B33" font-weight="700">자유롭게</tspan><tspan x="46.00" y="21.18" font-size="3.704" fill="#6B7280">개념과 문법 설명, 공개 논문 읽기 도움, 트랙 B 원고</tspan></text>
