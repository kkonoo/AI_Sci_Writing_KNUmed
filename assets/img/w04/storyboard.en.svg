<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="31.12" y="27.35" font-size="3.704" fill="#262B33" font-weight="700">Does compound X change</tspan><tspan x="31.12" y="32.17" font-size="3.704" fill="#262B33" font-weight="700">general health?</tspan></text>
