<text text-anchor="start" letter-spacing="-0.015em"><tspan x="65.05" y="46.64" font-size="3.881" fill="#262B33">Compound X reduces</tspan><tspan x="65.05" y="51.69" font-size="3.881" fill="#262B33">interstitial fibrosis</tspan><tspan x="65.05" y="56.73" font-size="3.881" fill="#262B33">in the obstructed</tspan><tspan x="65.05" y="61.78" font-size="3.881" fill="#262B33">kidney.</tspan></text>
