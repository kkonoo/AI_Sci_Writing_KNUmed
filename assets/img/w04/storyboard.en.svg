<text text-anchor="start" letter-spacing="-0.015em"><tspan x="5.80" y="46.64" font-size="3.881" fill="#262B33">Mice given compound X</tspan><tspan x="5.80" y="51.69" font-size="3.881" fill="#262B33">or vehicle have</tspan><tspan x="5.80" y="56.73" font-size="3.881" fill="#262B33">similar body weight</tspan><tspan x="5.80" y="61.78" font-size="3.881" fill="#262B33">and serum creatinine</tspan><tspan x="5.80" y="66.82" font-size="3.881" fill="#262B33">after UUO.</tspan></text>
</g>
