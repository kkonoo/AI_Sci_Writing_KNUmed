<g id="n을-쓰는-법">
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="156.00" y="9.44" font-size="4.234" fill="#262B33" font-weight="700">n을 쓰는 법</tspan></text>
</g>
<g id="Before">
<rect x="166.00" y="16.00" width="70.00" height="26.00" rx="0.80" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="0.265"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="167.80" y="27.42" font-size="4.057" fill="#262B33" font-weight="700">Before</tspan><tspan x="167.80" y="33.45" font-size="3.704" fill="#6B7280">n = 18 (6 mice × 3 sections)</tspan></text>
</g>
<g id="After">
<rect x="166.00" y="50.00" width="70.00" height="31.00" rx="0.80" fill="#2F343B"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="167.80" y="59.10" font-size="4.057" fill="#FFFFFF" font-weight="700">After</tspan><tspan x="167.80" y="65.14" font-size="3.704" fill="#FFFFFF">n = 6 mice per group. For</tspan><tspan x="167.80" y="69.95" font-size="3.704" fill="#FFFFFF">each mouse, values from three</tspan><tspan x="167.80" y="74.77" font-size="3.704" fill="#FFFFFF">sections were averaged.</tspan></text>
</g>
<g id="가상의-예시-단일세포-데이터에서는-세포-수가-아니라-환자-수가-n이다-">
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="4.00" y="92.20" font-size="3.528" fill="#6B7280">가상의 예시. 단일세포 데이터에서는 세포 수가 아니라 환자 수가 n이다.</tspan></text>
</g>
