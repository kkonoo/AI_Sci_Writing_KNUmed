<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="122mm" viewBox="0 0 240 122" role="img" aria-labelledby="fig-title" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title id="fig-title">Results 단락의 네 부분과 예시 문장</title>
<rect width="240" height="122" fill="#FFFFFF"/>
<defs></defs>
<g id="목적">
<rect x="4.00" y="4.00" width="56.00" height="16.00" rx="0.80" fill="#DADADC"/>
<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="32.00" y="10.54" font-size="4.410" fill="#262B33" font-weight="700">목적</tspan><tspan x="32.00" y="16.68" font-size="3.704" fill="#262B33">왜 이 실험을 했나</tspan></text>
</g>
<g id="To-test-whether-compound-X-reduces-fibro">
<rect x="66.00" y="4.00" width="170.00" height="16.00" rx="0.80" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="0.265"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="67.80" y="13.32" font-size="3.881" fill="#262B33">To test whether compound X reduces fibrosis,</tspan></text>
</g>
<g id="한-일">
<rect x="4.00" y="24.00" width="56.00" height="18.00" rx="0.80" fill="#DADADC"/>
<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="32.00" y="31.54" font-size="4.410" fill="#262B33" font-weight="700">한 일</tspan><tspan x="32.00" y="37.68" font-size="3.704" fill="#262B33">방법 이름과 조건만</tspan></text>
</g>
<g id="we-stained-kidney-sections-with-Masson-s">
<rect x="66.00" y="24.00" width="170.00" height="18.00" rx="0.80" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="0.265"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="67.80" y="31.80" font-size="3.881" fill="#262B33">we stained kidney sections with Masson's trichrome on day 7 after UUO</tspan><tspan x="67.80" y="36.84" font-size="3.881" fill="#262B33">(Fig. 2a).</tspan></text>
</g>
<g id="결과">
<rect x="4.00" y="46.00" width="56.00" height="36.00" rx="0.80" fill="#2F343B"/>
<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="32.00" y="62.54" font-size="4.410" fill="#FFFFFF" font-weight="700">결과</tspan><tspan x="32.00" y="68.68" font-size="3.704" fill="#FFFFFF">수치, n, 통계. 과거 시제</tspan></text>
</g>
<g id="UUO-increased-the-fibrotic-area-from-1-9">
<rect x="66.00" y="46.00" width="170.00" height="36.00" rx="0.80" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="0.265"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="67.80" y="57.75" font-size="3.881" fill="#262B33">UUO increased the fibrotic area from 1.9% ± 0.6% in sham mice to 18.2%</tspan><tspan x="67.80" y="62.80" font-size="3.881" fill="#262B33">± 3.1% in vehicle-treated mice (mean ± SD, n = 6 mice per group; P &lt;</tspan><tspan x="67.80" y="67.84" font-size="3.881" fill="#262B33">0.0001; Fig. 2b). Compound X lowered the fibrotic area to 9.6% ± 2.4%</tspan><tspan x="67.80" y="72.89" font-size="3.881" fill="#262B33">(P = 0.0004 versus UUO + vehicle; one-way ANOVA with Tukey's test).</tspan></text>
</g>
<g id="해석">
<rect x="4.00" y="86.00" width="56.00" height="18.00" rx="0.80" fill="#DADADC"/>
<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="32.00" y="93.54" font-size="4.410" fill="#262B33" font-weight="700">해석</tspan><tspan x="32.00" y="99.68" font-size="3.704" fill="#262B33">데이터 범위 안에서 한 문장</tspan></text>
</g>
<g id="Thus-compound-X-reduced-interstitial-fib">
<rect x="66.00" y="86.00" width="170.00" height="18.00" rx="0.80" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="0.265"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="67.80" y="93.80" font-size="3.881" fill="#262B33">Thus, compound X reduced interstitial fibrosis in the obstructed</tspan><tspan x="67.80" y="98.84" font-size="3.881" fill="#262B33">kidney.</tspan></text>
</g>
<g id="가상의-예시-Figure-2의-단락-문헌과-비교하는-일은-Discussi">
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="4.00" y="113.20" font-size="3.528" fill="#6B7280">가상의 예시, Figure 2의 단락. 문헌과 비교하는 일은 Discussion(W10)에서 한다.</tspan></text>
</g>
</svg>