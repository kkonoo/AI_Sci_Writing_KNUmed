<text text-anchor="start" letter-spacing="-0.015em"><tspan x="4.00" y="116.41" font-size="3.528" fill="#6B7280">No result or claim should appear only in the Abstract. The approach also comes from the last paragraph of the</tspan><tspan x="4.00" y="120.99" font-size="3.528" fill="#6B7280">Introduction.</tspan></text>
