<text text-anchor="start" letter-spacing="-0.015em"><tspan x="163.80" y="58.98" font-size="4.057" fill="#FFFFFF" font-weight="700">Check first</tspan><tspan x="163.80" y="64.57" font-size="3.352" fill="#FFFFFF">Does each figure's conclusion</tspan><tspan x="163.80" y="68.92" font-size="3.352" fill="#FFFFFF">sentence appear, with the same</tspan><tspan x="163.80" y="73.28" font-size="3.352" fill="#FFFFFF">strength, in the first Results</tspan><tspan x="163.80" y="77.64" font-size="3.352" fill="#FFFFFF">sentence, the Abstract and the</tspan><tspan x="163.80" y="81.99" font-size="3.352" fill="#FFFFFF">Title?</tspan></text>
