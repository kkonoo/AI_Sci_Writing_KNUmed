<g id="If-you-polish-sentences-first-that-work-">
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="162.00" y="27.44" font-size="3.704" fill="#262B33">If you polish sentences first,</tspan><tspan x="162.00" y="32.26" font-size="3.704" fill="#262B33">that work is lost when you later</tspan><tspan x="162.00" y="37.08" font-size="3.704" fill="#262B33">cut or move a paragraph.</tspan></text>
