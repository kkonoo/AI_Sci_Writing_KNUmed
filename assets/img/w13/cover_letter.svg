<text text-anchor="start" letter-spacing="-0.015em"><tspan x="25.80" y="55.92" font-size="4.057" fill="#FFFFFF" font-weight="700">주요 결과</tspan><tspan x="25.80" y="61.95" font-size="3.704" fill="#FFFFFF">2~3문장. Abstract와 같은 수치, 같은 주장 강도</tspan></text>
