<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="129mm" viewBox="0 0 240 129" role="img" aria-labelledby="fig-title" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title id="fig-title">Cover letter의 여섯 부분</title>
<rect width="240" height="129" fill="#FFFFFF"/>
<defs></defs>
<g id="Cover-letter-1쪽-안팎-">
<rect x="4.00" y="4.00" width="152.00" height="121.00" rx="0.80" fill="#EAEBEB"/>
<text text-anchor="start" letter-spacing="-0.015em"><tspan x="5.80" y="9.99" font-size="4.234" fill="#262B33" font-weight="700">Cover letter (1쪽 안팎)</tspan></text>
</g>
<g id="1">
