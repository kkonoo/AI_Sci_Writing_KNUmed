<text text-anchor="start" letter-spacing="-0.015em"><tspan x="25.80" y="19.92" font-size="4.057" fill="#262B33" font-weight="700">받는 사람과 첫 문단</tspan><tspan x="25.80" y="25.95" font-size="3.704" fill="#6B7280">편집자 이름, 원고 제목, 논문 유형</tspan></text>
</g>
