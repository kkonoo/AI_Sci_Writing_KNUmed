<text text-anchor="middle" letter-spacing="-0.015em"><tspan x="201.00" y="69.07" font-size="4.234" fill="#262B33" font-weight="700">지어내지 않는다</tspan><tspan x="201.00" y="75.16" font-size="3.704" fill="#262B33">저널에 관한 사실과 관련 논문은</tspan><tspan x="201.00" y="79.97" font-size="3.704" fill="#262B33">직접 확인한 것만</tspan></text>
